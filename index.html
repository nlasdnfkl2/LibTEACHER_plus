<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIB-TEACHER // 학교도서관 장서 및 출처 관리 입장</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
    
    :root {
      --bg: #fdfbf7;
      --black: #111111;
      --border: 3px solid var(--black);
      --border-thick: 4px solid var(--black);
      --yellow: #ffd83b;
      --cyan: #48dbfb;
      --green: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
    }

    .top-banner {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border: var(--border-thick);
      box-shadow: 6px 6px 0 var(--black);
      padding: 18px 22px;
      text-align: center;
    }

    .top-pill {
      display: inline-block;
      background: var(--green);
      border: 2px solid var(--black);
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .top-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .top-sub {
      font-size: 0.88rem;
      font-weight: 600;
      color: #444444;
      margin-top: 4px;
    }

    .launcher {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 540px) {
      .launcher { grid-template-columns: 1fr; }
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 42px 20px;
      border: var(--border-thick);
      box-shadow: 8px 8px 0 var(--black);
      text-decoration: none;
      color: var(--black);
      text-align: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .nav-btn.weeding { background: var(--yellow); }
    .nav-btn.citation { background: var(--cyan); }

    .nav-btn:hover {
      transform: translate(-4px, -4px);
      box-shadow: 12px 12px 0 var(--black);
    }

    .nav-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--black);
    }

    .nav-tag {
      background: var(--black);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 3px 10px;
      letter-spacing: 0.04em;
    }

    .nav-title {
      font-size: 1.55rem;
      font-weight: 900;
    }

    .nav-desc {
      font-size: 0.85rem;
      font-weight: 700;
      color: #222222;
    }
  </style>
</head>
<body>
  <header class="top-banner">
    <span class="top-pill">LIB-TEACHER v1.1</span>
    <h1 class="top-title">학교도서관 장서 제적 판별 &amp; 출처 관리</h1>
    <p class="top-sub">원하는 작업 공간을 선택해 입장하세요.</p>
  </header>

  <nav class="launcher" aria-label="작업 페이지 선택">
    <a href="weeding.html" class="nav-btn weeding">
      <span class="nav-tag">COLLECTION</span>
      <span class="nav-title">장서관리 페이지</span>
      <span class="nav-desc">제적 판별 · 7% 상한 · 사유서 출력</span>
    </a>
    <a href="citation.html" class="nav-btn citation">
      <span class="nav-tag">CITATION</span>
      <span class="nav-title">출처 관리 페이지</span>
      <span class="nav-desc">도서/DOI 조회 · 참고문헌 목록</span>
    </a>
  </nav>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetPage = params.get('page');
    if (targetPage === 'weeding') {
      window.location.replace('weeding.html');
    } else if (targetPage === 'citation') {
      window.location.replace('citation.html');
    }
  </script>
</body>
</html>
